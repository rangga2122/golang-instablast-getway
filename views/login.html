<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - InstaBlast Pro</title>
  <link rel="icon" href="/icon.ico" sizes="any" />
  <style>
    :root {
      --bg-soft: #edf8f0;
      --card: rgba(255, 255, 255, 0.96);
      --text: #101828;
      --muted: #667085;
      --border: rgba(16, 24, 40, 0.08);
      --accent: #16a34a;
      --accent-2: #10b981;
      --accent-3: #0f766e;
      --danger: #dc2626;
      --success: #16a34a;
      --shadow: 0 16px 45px rgba(15, 23, 42, 0.10);
      --radius: 18px;
      --radius-sm: 10px;
      --transition: all 0.2s ease;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(34, 197, 94, 0.14), transparent 28%),
        radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.12), transparent 24%),
        linear-gradient(180deg, #ffffff 0%, var(--bg-soft) 100%);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .login-topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 9px 20px;
      background: #0f9f67;
      box-shadow: none;
    }

    .topbar-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .topbar-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      flex: 0 0 34px;
    }

    .topbar-logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .topbar-copy strong {
      display: block;
      color: #ffffff;
      font-size: 17px;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .topbar-copy span {
      display: none;
    }

    .login-shell {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .login-card {
      width: min(460px, 100%);
      padding: 22px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(22, 163, 74, 0.12);
      color: #15803d;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .login-title {
      margin: 0 0 18px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.03em;
    }

    .login-subtitle {
      margin: -10px 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .auth-switch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 18px;
      padding: 4px;
      border-radius: 12px;
      background: rgba(16, 24, 40, 0.05);
    }

    .auth-tab {
      border: none;
      border-radius: 9px;
      padding: 9px 12px;
      background: transparent;
      color: #344054;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .auth-tab.active {
      color: #ffffff;
      background: var(--accent);
      box-shadow: none;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .form-shell {
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: 0;
    }

    .form-title {
      margin: 0 0 5px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .form-copy {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .trial-copy {
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(22, 163, 74, 0.08);
      color: #166534;
      font-size: 12px;
      line-height: 1.5;
    }

    .otp-box {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(15, 118, 110, 0.06);
      border: 1px solid rgba(15, 118, 110, 0.12);
    }

    .otp-box.active {
      display: block;
    }

    .otp-note {
      margin: 0 0 14px;
      color: #0f766e;
      font-size: 12px;
      line-height: 1.5;
    }

    .btn-row-inline {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .btn-row-inline .btn {
      width: auto;
      flex: 1 1 180px;
      margin-top: 0;
    }

    .form-group + .form-group {
      margin-top: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid rgba(16, 24, 40, 0.1);
      border-radius: var(--radius-sm);
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: #ffffff;
      outline: none;
      transition: var(--transition);
      box-shadow: none;
    }

    input:focus {
      border-color: rgba(16, 185, 129, 0.48);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.10);
    }

    input::placeholder {
      color: #98a2b3;
    }

    .btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary {
      margin-top: 16px;
      color: #ffffff;
      background: var(--accent);
      box-shadow: none;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: none;
    }

    .btn-primary:disabled {
      opacity: 0.72;
      cursor: wait;
      transform: none;
    }

    .btn-whatsapp {
      width: auto;
      margin: 16px auto 0;
      padding: 8px 12px;
      color: #16734a;
      background: transparent;
      border: 0;
    }

    .btn-whatsapp:hover {
      background: rgba(37, 211, 102, 0.08);
    }

    .btn-icon {
      width: 16px;
      height: 16px;
      display: inline-flex;
      color: currentColor;
      flex: 0 0 16px;
    }

    .btn-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .status {
      min-height: 18px;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .status.info {
      color: #6b7280;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }

    .hp-field {
      position: absolute;
      left: -9999px;
      opacity: 0;
      pointer-events: none;
    }

    .login-footnote {
      display: none;
      margin-top: 10px;
      color: #667085;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 640px) {
      .login-topbar {
        min-height: 54px;
        padding: 8px 14px;
      }

      .topbar-copy strong {
        font-size: 16px;
      }

      .login-shell {
        align-items: flex-start;
        padding: 18px 12px;
      }

      .login-card {
        padding: 18px;
        border-radius: 16px;
      }

      .login-title {
        font-size: 22px;
      }

      .form-shell {
        padding: 0;
      }

      .form-title {
        font-size: 16px;
      }

      .login-subtitle,
      .form-copy,
      .trial-copy,
      label,
      input,
      .btn,
      .login-footnote,
      .card-badge,
      .auth-tab {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <header class="login-topbar">
    <div class="topbar-brand">
      <div class="topbar-logo">
        <img src="/icon.ico" alt="InstaBlast Pro" />
      </div>
      <div class="topbar-copy">
        <strong>InstaBlast Pro</strong>
        <span>Fastblast</span>
      </div>
    </div>
  </header>

  <main class="login-shell">
    <section class="login-card">
      <h1 class="login-title">Masuk ke InstaBlast</h1>

      <div class="auth-switch">
        <button class="auth-tab active" type="button" data-mode="login">Login</button>
        <button class="auth-tab" type="button" data-mode="trial">Daftar Trial</button>
      </div>

      <div class="panel active" id="loginPanel">
        <div class="form-shell">
          <form id="loginForm">
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="contoh@email.com" required autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input id="password" type="password" placeholder="Masukkan password" required autocomplete="current-password" />
            </div>
            <button class="btn btn-primary" id="submitBtn" type="submit">Masuk</button>
          </form>

          <div class="status info" id="loginStatus"></div>
        </div>
      </div>

      <div class="panel" id="trialPanel">
        <div class="form-shell">
          <h2 class="form-title">Daftar Trial</h2>
          <p class="trial-copy">Isi data berikut. Kode OTP akan dikirim ke WhatsApp Anda.</p>

          <form id="trialForm">
            <div class="form-group">
              <label for="trialEmail">Email</label>
              <input id="trialEmail" type="email" placeholder="email trial Anda" required autocomplete="email" />
            </div>
            <div class="form-group">
              <label for="trialPassword">Password</label>
              <input id="trialPassword" type="password" placeholder="Minimal 6 karakter" required autocomplete="new-password" />
            </div>
            <div class="form-group">
              <label for="trialConfirmPassword">Konfirmasi Password</label>
              <input id="trialConfirmPassword" type="password" placeholder="Ulangi password" required autocomplete="new-password" />
            </div>
            <div class="form-group">
              <label for="trialPhone">Nomor WhatsApp</label>
              <input id="trialPhone" type="tel" placeholder="Contoh: 628123456789" required autocomplete="tel" />
            </div>
            <div class="hp-field" aria-hidden="true">
              <label for="trialWebsite">Website</label>
              <input id="trialWebsite" type="text" tabindex="-1" autocomplete="off" />
            </div>
            <button class="btn btn-primary" id="trialSubmitBtn" type="submit">Kirim OTP ke WhatsApp</button>
          </form>

          <div class="otp-box" id="trialOtpBox">
            <p class="otp-note" id="trialOtpNote">Kode OTP sudah dikirim ke WhatsApp Anda.</p>
            <div class="form-group">
              <label for="trialOtpCode">Kode OTP</label>
              <input id="trialOtpCode" type="text" inputmode="numeric" maxlength="6" placeholder="Masukkan 6 digit OTP" autocomplete="one-time-code" />
            </div>
            <div class="btn-row-inline">
              <button class="btn btn-primary" id="trialVerifyBtn" type="button">Verifikasi & Buat Trial</button>
              <button class="btn btn-whatsapp" id="trialResendBtn" type="button">Kirim Ulang OTP</button>
            </div>
          </div>

          <div class="status info" id="trialStatus"></div>
        </div>
      </div>

      <a class="btn btn-whatsapp" href="https://wa.me/6285240956744" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3a8.5 8.5 0 0 0-7.4 12.7L3.5 21l5.5-1.4A8.5 8.5 0 1 0 12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M9 8.8c.2-.4.4-.4.7-.4h.6c.2 0 .4 0 .6.4.2.5.7 1.7.8 1.8.1.2.1.3 0 .5-.1.2-.2.3-.4.5l-.3.3c-.1.1-.2.2-.1.4.1.2.6 1 1.4 1.6.9.7 1.6.9 1.8 1 .2.1.3 0 .4-.1l.6-.7c.2-.2.3-.2.5-.1.2.1 1.5.7 1.8.8.3.1.4.2.4.4 0 .2-.1 1-.7 1.5-.5.4-1.1.5-1.5.5-.4 0-1-.1-1.9-.5-.5-.2-1.2-.5-2-1.2-.6-.5-1.1-1.1-1.5-1.7-.4-.6-.8-1.3-1.1-2-.3-.7-.4-1.3-.4-1.8 0-.5.2-.9.5-1.3.2-.3.4-.4.6-.4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </span>
        WhatsApp Admin
      </a>

    </section>
  </main>

  <script>
    const tabs = document.querySelectorAll('.auth-tab');
    const panels = {
      login: document.getElementById('loginPanel'),
      trial: document.getElementById('trialPanel')
    };

    function setMode(mode) {
      tabs.forEach(function (tab) {
        tab.classList.toggle('active', tab.dataset.mode === mode);
      });
      Object.keys(panels).forEach(function (key) {
        panels[key].classList.toggle('active', key === mode);
      });
    }

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        setMode(tab.dataset.mode);
      });
    });

    if (window.location.hash === '#trial' || new URLSearchParams(window.location.search).get('mode') === 'trial') {
      setMode('trial');
    }

    function setStatus(id, message, type) {
      const el = document.getElementById(id);
      el.textContent = message || '';
      el.className = 'status ' + (type || 'info');
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');

      setStatus('loginStatus', 'Memproses login...', 'info');
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');
        setStatus('loginStatus', 'Login berhasil, mengarahkan ke dashboard...', 'success');
        location.href = '/app';
      } catch (err) {
        setStatus('loginStatus', err.message, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });

    const trialOtpState = {
      sessionId: '',
      phoneMasked: '',
      expiresAt: ''
    };

    function setTrialOTPBox(active, note) {
      const box = document.getElementById('trialOtpBox');
      const noteEl = document.getElementById('trialOtpNote');
      box.classList.toggle('active', !!active);
      if (note) {
        noteEl.textContent = note;
      }
    }

    document.getElementById('trialForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const submitBtn = document.getElementById('trialSubmitBtn');
      const password = document.getElementById('trialPassword').value;
      const confirmPassword = document.getElementById('trialConfirmPassword').value;
      const formStartedAt = Date.now();

      if (password !== confirmPassword) {
        setStatus('trialStatus', 'Konfirmasi password tidak cocok', 'error');
        return;
      }

      setStatus('trialStatus', 'Mengirim OTP ke WhatsApp...', 'info');
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/auth/trial/request-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('trialEmail').value.trim(),
            password: password,
            confirm_password: confirmPassword,
            phone: document.getElementById('trialPhone').value.trim(),
            website: document.getElementById('trialWebsite').value,
            form_started_at: window.__trialFormStartedAt || formStartedAt
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Pengiriman OTP gagal');
        trialOtpState.sessionId = data.session_id || '';
        trialOtpState.phoneMasked = data.phone_masked || '';
        trialOtpState.expiresAt = data.expires_at || '';
        setTrialOTPBox(true, 'OTP dikirim ke WhatsApp ' + (trialOtpState.phoneMasked || 'Anda') + '. Kode berlaku sekitar 5 menit.');
        setStatus('trialStatus', 'OTP berhasil dikirim. Masukkan 6 digit kode untuk lanjut membuat akun trial.', 'success');
        document.getElementById('trialOtpCode').focus();
      } catch (err) {
        setStatus('trialStatus', err.message, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.getElementById('trialVerifyBtn').addEventListener('click', async function () {
      const verifyBtn = document.getElementById('trialVerifyBtn');
      const otpCode = document.getElementById('trialOtpCode').value.trim();

      if (!trialOtpState.sessionId) {
        setStatus('trialStatus', 'Minta OTP dulu sebelum verifikasi.', 'error');
        return;
      }
      if (otpCode.length < 4) {
        setStatus('trialStatus', 'Masukkan kode OTP yang benar.', 'error');
        return;
      }

      setStatus('trialStatus', 'Memverifikasi OTP dan membuat akun trial...', 'info');
      verifyBtn.disabled = true;

      try {
        const res = await fetch('/api/auth/trial/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: trialOtpState.sessionId,
            otp_code: otpCode
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Verifikasi OTP gagal');
        setStatus('trialStatus', 'Verifikasi berhasil, mengarahkan ke dashboard...', 'success');
        location.href = '/app';
      } catch (err) {
        setStatus('trialStatus', err.message, 'error');
      } finally {
        verifyBtn.disabled = false;
      }
    });

    document.getElementById('trialResendBtn').addEventListener('click', function () {
      document.getElementById('trialForm').requestSubmit();
    });

    window.__trialFormStartedAt = Date.now();
  </script>
</body>
</html>
